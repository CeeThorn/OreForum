<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      padding: 1rem;
    }

    .card {
      max-width: 400px;
      margin: auto;
      background: #ffffff;
      border-radius: 0.75rem;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 1rem;
      font-size: 1.875rem;
      font-weight: 700;
      color: #111827;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    button {
      margin-top: 0.25rem;
      background-color: #2563eb;
      color: white;
      padding: 0.6rem;
      border: none;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .footer-text {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #374151;
    }

    .footer-text a {
      color: #2563eb;
      text-decoration: underline;
    }

    .footer-text a:hover {
      color: #1e40af;
    }
  </style>
</head>

<body>
  <main>
    <div class="card">
      <h1>Login</h1>

      <form>
        <input type="email" placeholder="Email" required />
        <input
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />

        <button type="submit">Log In</button>
      </form>

      <div class="footer-text">
        Don’t have an account?
        <a href="/register">Create Account</a>
      </div>
    </div>
  </main>
</body>
</html>
