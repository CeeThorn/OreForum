<h1 class="profiles-title">Character Profiles</h1>


<div class="container">
  <div id="profiles-container" class="card__container"></div>
</div>

<div class="fixed-home-btn" data-aos="zoom-in" data-aos-anchor-placement="top-bottom">
  <button onclick="window.location.href = '/index.html';" class="home-button">Home</button>
</div>

<script>
function loadProfiles() {
  const container = document.getElementById('profiles-container');
  
  // FIX: Clear the container first so old cards don't "linger" on refresh
  container.innerHTML = ''; 

  const mockData = [
    { name: "Valerius the Brave", createdAt: new Date().toISOString(), coverImage: "light.jpg" },
    { name: "Elowen Shadowstep", createdAt: "2024-01-15T12:00:00Z", coverImage: "dark.jpg" },
    { name: "Morgath the Wise", createdAt: "2023-11-20T10:30:00Z", coverImage: "flowers.jpg" },
     { name: "Valerius the Brave", createdAt: new Date().toISOString(), coverImage: "light.jpg" },
    { name: "Elowen Shadowstep", createdAt: "2024-01-15T12:00:00Z", coverImage: "dark.jpg" },
    { name: "Morgath the Wise", createdAt: "2023-11-20T10:30:00Z", coverImage: "flowers.jpg" }
  ];

  const storedProfiles = JSON.parse(localStorage.getItem("characters"));
  
  // If storedProfiles is null or empty, it will use mockData
  const profiles = (storedProfiles && storedProfiles.length > 0) ? storedProfiles : mockData;

  profiles.forEach(profile => {
    const article = document.createElement('article');
    article.className = 'card__article';

  article.setAttribute('data-aos', 'fade-up');
  article.setAttribute('data-aos-duration', '1000');

    const createdDate = profile.createdAt
      ? new Date(profile.createdAt).toLocaleDateString()
      : 'Unknown date';

    // Simplified image logic: ensure we don't double up on the "/images/" path
    let imgSrc = profile.coverImage;
    if (!imgSrc.startsWith('http') && !imgSrc.startsWith('blob:') && !imgSrc.startsWith('/images/')) {
      imgSrc = `/images/${imgSrc}`;
    }

    article.innerHTML = `
      <img src="${imgSrc}" class="card__img" alt="${profile.name}" />
      <div class="card__data">
        <span class="card__description">Created on ${createdDate}</span>
        <h2 class="card__title">${profile.name}</h2>
        <a href="#" class="card__button">View More</a>
      </div>
    `;

    container.appendChild(article);
  });
  if (window.AOS) {
    AOS.refresh();
  }

}

loadProfiles();
</script>
<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script>
  AOS.init();
</script>

</body>
</html>
