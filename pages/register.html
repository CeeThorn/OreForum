<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="/styles/index.css" />
  <link rel="stylesheet" href="/styles/sign.css" />
  <link rel="stylesheet" href="/styles/login.css" />

  <style> 
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      padding: 1rem;
    }

    .card {
      max-width: 400px;
      margin: auto;
      background: #ffffff;
      border-radius: 0.75rem;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 1rem;
      font-size: 1.875rem;
      font-weight: 700;
      color: #111827;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .rinput {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      font-size: 1rem;
    }

    rinput:focus {
      outline: none;
      border-color: #25eb56;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .rbutton {
      margin-top: 0.25rem;
      background-color: #25eb7e;
      color: white;
      padding: 0.6rem;
      border: none;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    rbutton:hover {
      background-color: #1dd88a;
    }

    .rfooter-text {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #374151;
    }

    .rfooter-text a {
      color: #25eb60;
      text-decoration: underline;
    }

    .rfooter-text a:hover {
      color: #25eb60;
    }
  </style>
</head>

<body>
  <main>
    <div class="card">
      <h1>Register</h1>

      <form>
        <input type="email" placeholder="Email" required />
        <input
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          class="rinput"
          required
        />

        <button type="submit" class="rbutton">Register</button>
      </form>

      <div class="rfooter-text">
        Have an account?
        <a href="/login">Log In</a>
      </div>
    </div>
  </main>
</body>
</html>
